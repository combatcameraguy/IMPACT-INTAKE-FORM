<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Entertainment Group - CSP Program Intake</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        .logo-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-header img {
            max-width: 150px;
            height: auto;
        }
        
        h2 { color: #333; border-bottom: 2px solid #ffb900; padding-bottom: 10px; display: inline-block;}
        .form-section { margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        button {
            background-color: #ffb900;
            color: #333;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover { background-color: #e5a800; }

        .consent { font-size: 0.9em; color: #666; display: flex; align-items: center; gap: 10px; margin-top: 20px;}
        .consent input { width: auto; margin: 0; }
        
        #status-message { margin-top: 15px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-header">
        <img src="impact-logo-vert-tag-color.png" alt="Impact Entertainment Group Logo">
        <h3>Connected</h3>
    </div>

    <h2>CSP Program Intake Form & Application</h2>

    <form id="intake-form">
        
        <div class="form-section">
            <h3>Personal Information</h3>
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>

            <label for="cityState">City, State (Duty Location) *</label>
            <input type="text" id="cityState" name="cityState" required>

            <label for="transport">Do you have reliable transportation? *</label>
            <select id="transport" name="transport" required>
                <option value="">Select option...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-section">
            <h3>Military Background</h3>
            <label for="mStatus">What is your current status? *</label>
            <select id="mStatus" name="mStatus" required>
                <option value="">Select status...</option>
                <option value="Active Duty">Active Duty</option>
                <option value="Transitioning Service Member">Transitioning Service Member</option>
                <option value="Veteran">Veteran</option>
                <option value="Military Spouse">Military Spouse</option>
            </select>

            <label for="branch">Branch of Service *</label>
            <select id="branch" name="branch" required>
                <option value="">Select branch...</option>
                <option value="Army">Army</option>
                <option value="Navy">Navy</option>
                <option value="Air Force">Air Force</option>
                <option value="Marines">Marines</option>
                <option value="Coast Guard">Coast Guard</option>
                <option value="Space Force">Space Force</option>
            </select>

            <label for="mos">MOS / Job Specialty *</label>
            <input type="text" id="mos" name="mos" required>

            <label for="payGrade">Pay Grade *</label>
            <input type="text" id="payGrade" name="payGrade" required>

            <label for="etsDate">ETS / Retirement Date *</label>
            <input type="date" id="etsDate" name="etsDate" required>

            <label for="terminalLeave">Start of Terminal Leave Date (if known)</label>
            <input type="date" id="terminalLeave" name="terminalLeave">
        </div>

        <div class="form-section">
            <h3>Interests & Capabilities</h3>
            <label for="opportunities">Which opportunities with IMPACT are you interested in? *</label>
            <input type="text" id="opportunities" name="opportunities" required>

            <label for="skills">Please list any skills, certifications, trades, or experience (military or civilian)</label>
            <textarea id="skills" name="skills" rows="3" style="width:100%; padding:10px; margin-top:5px;"></textarea>

            <label for="interestAreas">Which areas are you MOST interested in working in?</label>
            <input type="text" id="interestAreas" name="interestAreas">

            <label for="availability">General availability or scheduling / physical limitations:</label>
            <input type="text" id="availability" name="availability">
        </div>

        <div class="consent">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent" style="margin:0; font-weight:normal;">I agree to be contacted by IMPACT Entertainment Group regarding training, film, and employment opportunities. *</label>
        </div>

        <button type="submit" id="submit-btn">Submit Application</button>
        <p id="status-message"></p>
    </form>
</div>

<!-- FIREBASE INTEGRATION -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // CONFIGURATION INSERTED HERE
    const firebaseConfig = {  
      apiKey: "AIzaSyCEAoWW1iGQJz9cNJINvONIDaidXLkxK8s",  
      authDomain: "impact-datatrak.firebaseapp.com",  
      projectId: "impact-datatrak",  
      storageBucket: "impact-datatrak.firebasestorage.app",  
      messagingSenderId: "489513066612",  
      appId: "1:489513066612:web:d8540498107aad77cff121"  
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('intake-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        submitBtn.textContent = "Submitting...";
        submitBtn.disabled = true;

        try {
            const formData = new FormData(form);
            const applicationData = Object.fromEntries(formData.entries());
            applicationData.submittedAt = new Date();

            // Saves to Firestore collection named 'Impacts'
            await addDoc(collection(db, "Impacts"), applicationData);

            statusMsg.style.color = "green";
            statusMsg.textContent = "Application successfully sent to the IMPACT Dashboard!";
            statusMsg.style.display = "block";
            
            form.reset(); 
            
        } catch (error) {
            console.error("Error adding document: ", error);
            statusMsg.style.color = "red";
            statusMsg.textContent = "Error submitting application. Please try again.";
            statusMsg.style.display = "block";
        } finally {
            submitBtn.textContent = "Submit Application";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
