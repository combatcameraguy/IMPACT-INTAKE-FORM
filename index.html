<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Entertainment Group - CSP Program Intake</title>
    <style>
        :root {
            /* Brand Colors */
            --impact-yellow: #f7b512; 
            --impact-dark-grey: #3c3c3c;
            --light-grey: #f4f4f9;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-grey);
            color: var(--impact-dark-grey); /* Using requested Grey for text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }

        /* Logo Styling */
        .logo-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        .logo-header img {
            max-width: 200px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        h2 { 
            color: var(--impact-dark-grey); 
            border-bottom: 3px solid var(--impact-yellow); /* Impact Yellow accent */
            padding-bottom: 10px; 
            display: inline-block;
            margin-top: 0;
        }

        .form-section { margin-bottom: 25px; }
        
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: var(--impact-dark-grey); 
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 16px;
        }

        /* Button using Requested Yellow */
        button {
            background-color: var(--impact-yellow);
            color: var(--impact-dark-grey);
            padding: 15px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover { 
            opacity: 0.9; /* Slight darken effect */
        }

        .consent { 
            font-size: 0.9em; 
            color: var(--impact-dark-grey); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-top: 25px;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
        }
        .consent input { width: auto; margin: 0; transform: scale(1.2); }

        #status-message { 
            margin-top: 20px; 
            text-align: center; 
            font-weight: bold; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-header">
        <!-- Logo referencing your github file -->
        <img src="impact-logo-vert-tag-color.png" alt="Impact Entertainment Group Logo">
        <h3 style="margin-top: 10px; margin-bottom: 0; color: var(--impact-dark-grey);">Connected</h3>
    </div>

    <h2>CSP Program Intake Form & Application</h2>

    <!-- ID added for JS binding -->
    <form id="intake-form">
        
        <div class="form-section">
            <h3 style="color: var(--impact-yellow); background: var(--impact-dark-grey); padding: 5px 10px; font-size: 1.1rem;">Personal Information</h3>
            
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">

            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required placeholder="(555) 123-4567">

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">

            <label for="cityState">City, State (Duty Location) *</label>
            <input type="text" id="cityState" name="cityState" required>

            <label for="transport">Do you have reliable transportation? *</label>
            <select id="transport" name="transport" required>
                <option value="">Select option...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-section">
            <h3 style="color: var(--impact-yellow); background: var(--impact-dark-grey); padding: 5px 10px; font-size: 1.1rem;">Military Background</h3>

            <label for="mStatus">Current Status *</label>
            <select id="mStatus" name="mStatus" required>
                <option value="">Select status...</option>
                <option value="Active Duty">Active Duty</option>
                <option value="Transitioning Service Member">Transitioning Service Member</option>
                <option value="Veteran">Veteran</option>
                <option value="Military Spouse">Military Spouse</option>
            </select>

            <label for="branch">Branch of Service *</label>
            <select id="branch" name="branch" required>
                <option value="">Select branch...</option>
                <option value="Army">Army</option>
                <option value="Navy">Navy</option>
                <option value="Air Force">Air Force</option>
                <option value="Marines">Marines</option>
                <option value="Coast Guard">Coast Guard</option>
                <option value="Space Force">Space Force</option>
            </select>

            <label for="mos">MOS / Job Specialty *</label>
            <input type="text" id="mos" name="mos" required placeholder="e.g. 11X, IT Specialist">

            <label for="payGrade">Pay Grade *</label>
            <input type="text" id="payGrade" name="payGrade" required placeholder="e.g. E-5, O-3">

            <label for="etsDate">ETS / Retirement Date *</label>
            <input type="date" id="etsDate" name="etsDate" required>

            <label for="terminalLeave">Start of Terminal Leave Date (if known)</label>
            <input type="date" id="terminalLeave" name="terminalLeave">
        </div>

        <div class="form-section">
            <h3 style="color: var(--impact-yellow); background: var(--impact-dark-grey); padding: 5px 10px; font-size: 1.1rem;">Interests & Capabilities</h3>

            <label for="opportunities">Which opportunities with IMPACT are you interested in? *</label>
            <input type="text" id="opportunities" name="opportunities" required placeholder="e.g. Production, Post-Production, Training">

            <label for="skills">Skills, certifications, trades, or experience (military or civilian)</label>
            <textarea id="skills" name="skills" rows="4" style="width:100%; padding:12px; margin-top:6px; border-radius: 4px;"></textarea>

            <label for="interestAreas">Which areas are you MOST interested in working in?</label>
            <input type="text" id="interestAreas" name="interestAreas">

            <label for="availability">General availability or scheduling / physical limitations:</label>
            <input type="text" id="availability" name="availability">
        </div>

        <div class="consent">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent" style="margin:0; font-weight:normal;">I agree to be contacted by IMPACT Entertainment Group regarding training, film, and employment opportunities. *</label>
        </div>

        <button type="submit" id="submit-btn">Submit Application</button>
        <p id="status-message"></p>
    </form>
</div>

<!-- FIREBASE INTEGRATION -->
<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // YOUR FIREBASE CONFIGURATION (From your previous request)
    const firebaseConfig = {  
      apiKey: "AIzaSyCEAoWW1iGQJz9cNJINvONIDaidXLkxK8s",  
      authDomain: "impact-datatrak.firebaseapp.com",  
      projectId: "impact-datatrak",  
      storageBucket: "impact-datatrak.firebasestorage.app",  
      messagingSenderId: "489513066612",  
      appId: "1:489513066612:web:d8540498107aad77cff121"  
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form Handling Logic
    const form = document.getElementById('intake-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        // UI Updates during submission
        submitBtn.textContent = "Processing...";
        submitBtn.disabled = true;

        try {
            // Collect Data
            const formData = new FormData(form);
            const applicationData = Object.fromEntries(formData.entries());
            applicationData.submittedAt = new Date();

            // Save to Firestore (Populates Dashboard)
            await addDoc(collection(db, "Impacts"), applicationData);

            // Success Message (Using Impact Colors for visual consistency)
            statusMsg.style.backgroundColor = "var(--impact-yellow)";
            statusMsg.style.color = "var(--impact-dark-grey)";
            statusMsg.textContent = "Application successfully sent to the IMPACT Dashboard!";
            statusMsg.style.display = "block";
            
            form.reset(); // Clear fields
            
        } catch (error) {
            console.error("Error adding document: ", error);
            statusMsg.style.color = "#d32f2f"; // Error Red
            statusMsg.textContent = "Error submitting application. Please try again.";
            statusMsg.style.display = "block";
        } finally {
            submitBtn.textContent = "Submit Application";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
