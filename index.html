<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact DataTrak - Intake</title>
    <style>
        :root {
            --impact-yellow: #f7b512;
            --impact-grey: #3c3c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }
        .logo-header { text-align: center; margin-bottom: 2rem; padding-bottom: 1rem; }
        .logo-header img { max-width: 200px; height: auto; display: block; margin: 0 auto; }
        h2 { color: var(--impact-grey); border-bottom: 3px solid var(--impact-yellow); padding-bottom: 10px; margin-top: 0; }

        .form-section { margin-bottom: 1.5rem; }
        .section-title {
            background-color: var(--impact-grey); color: var(--impact-yellow);
            padding: 8px 12px; font-size: 1.1rem; margin-bottom: 15px; border-radius: 4px;
        }
        label { display: block; margin-top: 10px; font-weight: bold; color: #444; cursor: pointer; }

        input[type="text"], input[type="email"], input[type="tel"],
        input[type="date"], select, textarea {
            width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        button {
            background-color: var(--impact-yellow); color: var(--impact-grey);
            padding: 15px 20px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 18px; width: 100%; margin-top: 20px; font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        .consent-row {
            display: flex; align-items: flex-start; gap: 10px;
            margin-top: 20px; font-weight: normal !important; color: #444;
        }
        .consent-row input[type="checkbox"] { width: auto; margin-top: 5px; transform: scale(1.3); cursor: pointer; }
        
        /* Status Indicator Styles */
        .status-indicator {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
            font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-checking .status-dot { background-color: #fbbf24; animation: pulse 1.5s infinite; }
        .status-online .status-dot { background-color: #22c55e; }
        .status-offline .status-dot { background-color: #ef4444; }
        
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-header">
        <img src="impact-logo-vert-tag-color.png" alt="Impact Entertainment Group Logo">
        <!-- Dynamic Connection Status -->
        <div id="connectionStatus" class="status-indicator status-checking">
            <span class="status-dot"></span>
            <span id="statusText">Checking Connection...</span>
        </div>
    </div>

    <h2>CSP Program Intake Form & Application</h2>
    <form id="intakeForm">
        <div class="form-section">
            <div class="section-title">Personal Information</div>
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required>
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required>
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
            <label for="cityState">City, State (Duty Location) *</label>
            <input type="text" id="cityState" name="cityState" required>
            <label for="transport">Do you have reliable transportation? *</label>
            <select id="transport" name="transport" required>
                <option value="">Select option...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>
        <div class="form-section">
            <div class="section-title">Military Background</div>
            <label for="mStatus">What is your current status? *</label>
            <select id="mStatus" name="mStatus" required>
                <option value="">Select status...</option>
                <option value="Active Duty">Active Duty</option>
                <option value="Transitioning Service Member">Transitioning Service Member</option>
                <option value="Veteran">Veteran</option>
                <option value="Military Spouse">Military Spouse</option>
            </select>
            <label for="branch">Branch of Service *</label>
            <select id="branch" name="branch" required>
                <option value="">Select branch...</option>
                <option value="Army">Army</option>
                <option value="Navy">Navy</option>
                <option value="Air Force">Air Force</option>
                <option value="Marines">Marines</option>
                <option value="Coast Guard">Coast Guard</option>
                <option value="Space Force">Space Force</option>
            </select>
            <label for="mos">MOS / Job Specialty *</label>
            <input type="text" id="mos" name="mos" required>
            <label for="payGrade">Pay Grade *</label>
            <input type="text" id="payGrade" name="payGrade" required>
            <label for="etsDate">ETS / Retirement Date *</label>
            <input type="date" id="etsDate" name="etsDate" required>
            <label for="terminalLeave">Start of Terminal Leave Date (if known)</label>
            <input type="date" id="terminalLeave" name="terminalLeave">
        </div>
        <div class="form-section">
            <div class="section-title">Interests & Capabilities</div>
            <label for="opportunities">Which opportunities with IMPACT are you interested in? *</label>
            <input type="text" id="opportunities" name="opportunities" required>
            <label for="skills">Please list any skills, certifications, trades, or experience (military or civilian)</label>
            <textarea id="skills" name="skills" rows="4"></textarea>
            <label for="interestAreas">Which areas are you MOST interested in working in?</label>
            <input type="text" id="interestAreas" name="interestAreas">
            <label for="availability">General availability or scheduling / physical limitations:</label>
            <input type="text" id="availability" name="availability">
        </div>
        <!-- Consent Section -->
        <div class="consent-row">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent" style="font-weight: normal; margin-top: 5px;">I agree to be contacted by IMPACT Entertainment Group regarding training, film, and employment opportunities. *</label>
        </div>
        <button type="submit" id="submitBtn">Submit Application</button>
        <p id="statusMessage"></p>
    </form>
</div>

<!-- FIREBASE INTEGRATION -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {  
        apiKey: "AIzaSyCEAoWW1iGQJz9cNJINvONIDaidXLkxK8s",  
        authDomain: "impact-datatrak.firebaseapp.com",  
        projectId: "impact-datatrak",  
        storageBucket: "impact-datatrak.firebasestorage.app",  
        messagingSenderId: "489513066612",  
        appId: "1:489513066612:web:d8540498107aad77cff121",
        databaseURL: "https://impact-datatrak-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtdb = getDatabase(app); // Used purely for connection heartbeat

    // Live Connection Status Indicator
    const statusEl = document.getElementById('connectionStatus');
    const statusTextEl = document.getElementById('statusText');
    const connectedRef = ref(rtdb, ".info/connected");
    
    onValue(connectedRef, (snap) => {
        const isConnected = snap.val();
        if (isConnected === null) return; // Still checking
        
        statusEl.className = isConnected ? 'status-indicator status-online' : 'status-indicator status-offline';
        statusTextEl.textContent = isConnected ? 'Firebase Connected' : 'Disconnected from Firebase';
    });

    const form = document.getElementById('intakeForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Reset status
        statusMessage.style.color = "var(--impact-grey)";
        statusMessage.textContent = "Submitting...";

        submitBtn.textContent = "Processing...";
        submitBtn.disabled = true;

        try {
            const formData = new FormData(form);
            const applicationData = Object.fromEntries(formData.entries());
            applicationData.submittedAt = new Date().toISOString();
            
            await addDoc(collection(db, "Impacts"), applicationData);
            
            statusMessage.style.color = "#2e7d32";
            statusMessage.textContent = "Application successfully sent!";
            form.reset();
        } catch (error) {
            console.error("Submission failed:", error);
            statusMessage.style.color = "#d32f2f";
            statusMessage.textContent = "Error submitting application! Please try again.";
            submitBtn.disabled = false;
        } finally {
            submitBtn.textContent = "Submit Application";
        }
    });
</script>
</body>
</html>
